name: Build Windows (LP Wrapped)

on:
  push:
    branches:
      - lp-wrapped-flipbook
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Add ATL/MFC include and lib paths
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) { throw "VS install path not found" }
          Write-Host "VS install: $installPath"
          $msvcRoot = Get-ChildItem "$installPath\VC\Tools\MSVC" | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          $atlInc = Join-Path $msvcRoot.FullName "atlmfc\include"
          $atlLib = Join-Path $msvcRoot.FullName "atlmfc\lib\x64"
          if (-not (Test-Path (Join-Path $atlInc "atlbase.h"))) {
            Get-ChildItem "$installPath\VC\Tools\MSVC" -Recurse -Filter atlbase.h -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Found: $($_.FullName)" }
            throw "atlbase.h not found under $atlInc"
          }
          Write-Host "ATL include: $atlInc"
          Write-Host "ATL lib: $atlLib"
          "ATL_INCLUDE=$atlInc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ATL_LIB=$atlLib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $inc = if ($env:INCLUDE) { "$atlInc;$env:INCLUDE" } else { $atlInc }
          $lib = if ($env:LIB) { "$atlLib;$env:LIB" } else { $atlLib }
          "INCLUDE=$inc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIB=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBPATH=$lib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Generate VS2022 project files
        run: tools\premake5.exe vs2022
        shell: cmd

      - name: Build Release|x64
        shell: cmd
        run: >
          msbuild /m /v:minimal
          /p:Configuration=Release
          /p:Platform=x64
          /p:AdditionalIncludeDirectories="%ATL_INCLUDE%;%%(AdditionalIncludeDirectories)"
          /p:AdditionalLibraryDirectories="%ATL_LIB%;%%(AdditionalLibraryDirectories)"
          build\hmw-mod.sln

      - name: List build outputs
        run: |
          Get-ChildItem -Recurse build\bin\x64\Release | Select-Object FullName, Length
        shell: pwsh

      - name: Upload hmw-mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: hmw-mod-lp-wrapped
          path: |
            build/bin/x64/Release/hmw-mod.exe
            build/bin/x64/Release/hmw-mod.pdb
            build/bin/x64/Release/tlsdll.dll
            build/bin/x64/Release/tlsdll.pdb
            build/bin/x64/Release/runner.exe
            build/bin/x64/Release/runner.pdb
          if-no-files-found: error
