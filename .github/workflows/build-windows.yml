name: Build Windows (LP Wrapped)

on:
  push:
    branches:
      - lp-wrapped-flipbook
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release x64
    runs-on: windows-2022
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Locate ATL and write Directory.Build.targets
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) { throw "VS install path not found" }
          Write-Host "VS install: $installPath"
          $atlHeader = Get-ChildItem "$installPath\VC\Tools\MSVC" -Recurse -Filter atlbase.h -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $atlHeader) { throw "atlbase.h not found under $installPath" }
          $atlInc = $atlHeader.Directory.FullName
          $atlLib = Join-Path $atlHeader.Directory.Parent.FullName "lib\x64"
          Write-Host "ATL include: $atlInc"
          Write-Host "ATL lib: $atlLib"
          # Directory.Build.targets is imported AFTER the vcxproj, so it can override
          # TreatWarningAsError set by premake FatalCompileWarnings.
          $targets = @"
          <Project>
            <ItemDefinitionGroup>
              <ClCompile>
                <AdditionalIncludeDirectories>$atlInc;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>
                <TreatWarningAsError>false</TreatWarningAsError>
                <DisableSpecificWarnings>4005;4102;4127;4244;4505;4840;%(DisableSpecificWarnings)</DisableSpecificWarnings>
              </ClCompile>
              <Link>
                <AdditionalLibraryDirectories>$atlLib;%(AdditionalLibraryDirectories)</AdditionalLibraryDirectories>
              </Link>
            </ItemDefinitionGroup>
          </Project>
          "@
          $targets = ($targets -split "`n" | ForEach-Object { $_.TrimStart() }) -join "`n"
          New-Item -ItemType Directory -Force -Path "build" | Out-Null
          Set-Content -Path "Directory.Build.targets" -Value $targets -Encoding UTF8
          Set-Content -Path "build\Directory.Build.targets" -Value $targets -Encoding UTF8
          Get-Content build\Directory.Build.targets

      - name: Generate VS2022 project files
        run: tools\premake5.exe vs2022
        shell: cmd

      - name: Re-apply Directory.Build.targets after premake
        shell: pwsh
        run: |
          Copy-Item Directory.Build.targets build\Directory.Build.targets -Force
          Write-Host "Restored build\Directory.Build.targets"

      - name: Build Release|x64
        run: msbuild /m /v:minimal /p:Configuration=Release /p:Platform=x64 /p:TreatWarningAsError=false build\hmw-mod.sln

      - name: List build outputs
        run: |
          Get-ChildItem -Recurse build\bin\x64\Release | Select-Object FullName, Length
        shell: pwsh

      - name: Upload hmw-mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: hmw-mod-lp-wrapped
          path: |
            build/bin/x64/Release/hmw-mod.exe
            build/bin/x64/Release/hmw-mod.pdb
            build/bin/x64/Release/tlsdll.dll
            build/bin/x64/Release/tlsdll.pdb
            build/bin/x64/Release/runner.exe
            build/bin/x64/Release/runner.pdb
          if-no-files-found: error
